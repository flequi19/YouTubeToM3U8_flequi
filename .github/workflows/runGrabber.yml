name: LinkGrabber

permissions:
  contents: write   # da permiso al workflow para hacer push

on:
  schedule:
    - cron: '0 */3 * * *'   # corre cada 3 horas
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  runCode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Run grabber and commit if changed
        run: |
          chmod +x exec_grabber.sh && ./exec_grabber.sh
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube.m3u8 epg.xml || true
          git commit -m "Update playlist" || echo "No changes to commit"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
